<html>
<head>
    <style>
        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
        }

        .stops {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .stop {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .preview {
            height: 120px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 8px;
            padding: 6px 10px;
            cursor: pointer;
        }
    </style>
    <style>
        .angle-presets {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0;
        }

            .angle-presets button {
                padding: 6px 10px;
                border-radius: 6px;
                border: 1px solid #ccc;
                background: #fafafa;
                cursor: pointer;
                font-size: 0.9rem;
            }

                .angle-presets button:hover {
                    background: #eaeaea;
                }
    </style>

</head>
<body>
    <div class="container">
        <h2>FGHIJ Admin Page</h2>

        <!-- Number -->
        <label>What prompt number is this?</label>
        <input type="number" id="numberInput">

        <!-- Prompt -->
        <label>What is the current prompt?</label>
        <textarea id="promptInput" rows="3"></textarea>

        <!-- String -->
        <label>What video is it? (Example: 0A)</label>
        <input type="text" id="videoNumberInput">

        <!-- Gradient Input System -->
        <h3 style="margin-top:25px;">Want to input a custom gradient?</h3>

        <label>Paste Gradient (optional)</label>
        <input type="text" id="gradientInput" placeholder="e.g. linear-gradient(135deg, yellow, green)">

        <div class="row">
            <label>Type</label>
            <select id="gradType">
                <option value="linear">linear</option>
                <option value="radial">radial</option>
            </select>

            <label>Angle</label>
            <input type="number" id="gradAngle" value="0" style="width:80px"><div class="angle-presets">
                <button data-angle="0">0°</button>
                <button data-angle="45">45°</button>
                <button data-angle="90">90°</button>
                <button data-angle="135">135°</button>
                <button data-angle="180">180°</button>
                <button data-angle="225">225°</button>
                <button data-angle="270">270°</button>
                <button data-angle="315">315°</button>
            </div>

        </div>

        <label>Color Stops</label>
        <div id="gradStops" class="stops"><div class="stop"><input type="color" data-i="0"><input type="range" min="0" max="100" data-i="0"><input type="number" min="0" max="100" data-i="0" style="width: 60px;"><button data-i="0">X</button></div><div class="stop"><input type="color" data-i="1"><input type="range" min="0" max="100" data-i="1"><input type="number" min="0" max="100" data-i="1" style="width: 60px;"><button data-i="1">X</button></div></div>
        <button id="addStop">Add Color Stop</button>

        <label>Gradient Preview</label>
        <div id="gradPreview" class="preview" style="background: linear-gradient(0deg, rgb(255, 255, 0) 0%, rgb(0, 255, 0) 100%);"></div>

        <label>Generated CSS</label>
        <textarea id="gradCSS" readonly=""></textarea>

        <!-- URL -->
        <label>What is the link for your YouTube video?</label>
        <input type="url" id="urlInput" placeholder="https://example.com">

        <!-- Colors -->
        <label>What should the text color for perfection be?</label>
        <input type="color" id="hcolor" value="#00FF00">

        <label>What should the normal text color be?</label>
        <input type="color" id="mcolor" value="#000000">

        <label>What should the text color for insuffiency be?</label>
        <input type="color" id="lcolor" value="#FF0000">

        <!-- Password -->
        <label>What is the admin password?</label>
        <input type="password" id="passwordInput" autocomplete="new-password"><button id="submitBtn">Change FGHIJ Website</button>
<pre id="FGHIJoutput"></pre>

    </div>
    <script>
        let stops = [
            { color: "#ffff00", pos: 0 },
            { color: "#00ff00", pos: 100 }
        ];

        const stopsEl = document.getElementById("gradStops");
        const preview = document.getElementById("gradPreview");
        const cssOut = document.getElementById("gradCSS");
        const typeEl = document.getElementById("gradType");
        const angleEl = document.getElementById("gradAngle");
        const addBtn = document.getElementById("addStop");
        const importInput = document.getElementById("gradientInput");

        function renderStops() {
            stopsEl.innerHTML = "";

            stops.forEach((s, i) => {
                const div = document.createElement("div");
                div.className = "stop";

                const color = document.createElement("input");
                color.type = "color";
                color.value = s.color;
                color.dataset.i = i;

                const range = document.createElement("input");
                range.type = "range";
                range.min = 0;
                range.max = 100;
                range.value = s.pos;
                range.dataset.i = i;

                const num = document.createElement("input");
                num.type = "number";
                num.min = 0;
                num.max = 100;
                num.value = s.pos;
                num.style.width = "60px";
                num.dataset.i = i;

                const del = document.createElement("button");
                del.textContent = "X";
                del.dataset.i = i;

                div.appendChild(color);
                div.appendChild(range);
                div.appendChild(num);
                div.appendChild(del);

                stopsEl.appendChild(div);

                // Attach events WITHOUT re-rendering the whole list
                color.addEventListener("input", e => {
                    stops[i].color = e.target.value;
                    updatePreview();
                });

                range.addEventListener("input", e => {
                    const v = +e.target.value;
                    stops[i].pos = v;
                    num.value = v;   // sync only the number input
                    updatePreview();
                });

                num.addEventListener("input", e => {
                    const v = +e.target.value;
                    stops[i].pos = v;
                    range.value = v; // sync only the slider
                    updatePreview();
                });

                del.addEventListener("click", () => {
                    stops.splice(i, 1);
                    renderStops(); // only re-render when deleting
                });
            });

            updatePreview();
        }


        function attachEvents() {
            stopsEl.querySelectorAll("input[type=color]").forEach(el => {
                el.oninput = e => { stops[e.target.dataset.i].color = e.target.value; updatePreview(); };
            });
            stopsEl.querySelectorAll("input[type=range], input[type=number]").forEach(el => {
                el.oninput = e => { stops[e.target.dataset.i].pos = +e.target.value; renderStops(); };
            });
            stopsEl.querySelectorAll("button").forEach(btn => {
                btn.onclick = e => { stops.splice(e.target.dataset.i, 1); renderStops(); };
            });
        }

        function buildGradient() {
            const sorted = stops.slice().sort((a, b) => a.pos - b.pos);
            const stopStr = sorted.map(s => `${s.color} ${s.pos}%`).join(", ");
            return typeEl.value === "linear"
                ? `linear-gradient(${angleEl.value}deg, ${stopStr})`
                : `radial-gradient(circle, ${stopStr})`;
        }

        function updatePreview() {
            const g = buildGradient();
            preview.style.background = g;
            cssOut.value = g;
        }

        addBtn.onclick = () => {
            stops.push({ color: "#FFFFFF", pos: 50 });
            renderStops();
        };

        importInput.onchange = () => {
            const g = importInput.value.trim();
            if (!g.includes("gradient")) return;
            // Simple import: reset stops to two defaults
            stops = [
                { color: "#ff0000", pos: 0 },
                { color: "#0000ff", pos: 100 }
            ];
            renderStops();
        };

        renderStops(); document.querySelectorAll(".angle-presets button").forEach(btn => {
            btn.addEventListener("click", () => {
                const angle = btn.dataset.angle;
                angleEl.value = angle;   // update the angle input
                updatePreview();         // rebuild gradient with new angle
            });
        });
        document.getElementById("submitBtn").addEventListener("click", () => {

            // FIRST
            const numberInput = document.getElementById("numberInput").value.trim();
            const promptInput = document.getElementById("promptInput").value.trim();
            const first = `${numberInput} ${promptInput}`;

            // SECOND
            const second = "none";

            // THIRD
            const videoNumberInput = document.getElementById("videoNumberInput").value.trim();
            const gradientInput = document.getElementById("gradientInput").value.trim();
            const gradCSS = document.getElementById("gradCSS").value.trim();

            // Validate gradientInput
            const isValidGradient =
                gradientInput.startsWith("linear-gradient") ||
                gradientInput.startsWith("radial-gradient");

            const cssGradientInput = isValidGradient ? gradientInput : gradCSS;

            const third = `${videoNumberInput} ${cssGradientInput}`;

            // FOURTH
            const urlInput = document.getElementById("urlInput").value.trim();
            const hcolor = document.getElementById("hcolor").value;
            const mcolor = document.getElementById("mcolor").value;
            const lcolor = document.getElementById("lcolor").value;

            const fourth = `${urlInput} ${hcolor} ${mcolor} ${lcolor}`;

            // PASSWORD
            const password = document.getElementById("passwordInput").value;

            // Build URL
            const baseURL = "https://script.google.com/macros/s/AKfycby_PD70CNC1m9w3KTryFRfIZkODfZv24Zbnv5zZheqrISaj4vF6SddRYsh5BBamjcOy/exec";

            const url = `${baseURL}?password=${encodeURIComponent(password)}&first=${encodeURIComponent(first)}&second=${encodeURIComponent(second)}&third=${encodeURIComponent(third)}&fourth=${encodeURIComponent(fourth)}`;

            // Call macro
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("FGHIJoutput").textContent =
                        JSON.stringify(data, null, 2);
                })
                .catch(err => {
                    document.getElementById("FGHIJoutput").textContent =
                        "Error: " + err;
                });
        });

    </script>



</body>
</html>
